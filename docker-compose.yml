# ---------------------------------------------------------------------------
# docker-compose.yml — Local development environment for CallType
# ---------------------------------------------------------------------------
# Brings up the API, PostgreSQL, and Azurite (Azure Blob Storage emulator)
# with a single `docker compose up`. All services are pre-configured to talk
# to each other — no manual setup needed beyond having Docker installed.
#
# Usage:
#   docker compose up -d          # start everything in background
#   docker compose logs -f api    # follow API logs
#   docker compose down -v        # stop and remove volumes (clean slate)
# ---------------------------------------------------------------------------

services:
  api:
    build:
      context: src/server/CallType.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Database__ApplyMigrationsOnStartup=true
      - Cors__AllowedOrigins__0=http://localhost:8090
      - Cors__AllowedOrigins__1=http://127.0.0.1:8090
      # Connection to the postgres service by container name (Docker DNS).
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=calltype;Username=calltype;Password=calltype_dev_password
      # Business mode (organizations + audit archive) — separate database and
      # role, per KB3. Presence of this variable is what turns business mode
      # on (BusinessModeOptions); leave it unset to run anonymous-only.
      - ConnectionStrings__Audit=Host=db;Port=5432;Database=calltype_audit;Username=calltype_audit;Password=calltype_audit_dev_password
      # Azurite connection string — uses the well-known development account key
      # with the azurite hostname resolved by Docker DNS.
      - ConnectionStrings__BlobStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1
      - Jwt__Secret=dev-secret-min-32-characters-long!!
      - Jwt__Issuer=CallType.Api
      - Turn__SharedSecret=dev-turn-secret
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: calltype
      POSTGRES_USER: calltype
      POSTGRES_PASSWORD: calltype_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the second (Audit) database + its own dev role on first boot.
      # See infra/postgres/audit-roles.sql for the production role split this
      # local setup deliberately does NOT replicate (local dev has no
      # attacker model; that script is exercised instead by the integration
      # test fixture against a disposable Testcontainers database).
      - ./infra/postgres/init-audit-db.sh:/docker-entrypoint-initdb.d/init-audit-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calltype"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Azurite emulates Azure Blob Storage for local development.
  # The --skipApiVersionCheck flag is needed because the Azure.Storage.Blobs
  # SDK may use a newer API version than the Azurite image supports.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"   # Blob service
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service
    restart: unless-stopped

volumes:
  pgdata:
