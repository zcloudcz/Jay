name: calltype_core
description: "CallType client core: REST + SignalR client, auth, device directory and fan-out, local drift schema and the drift ProtocolStore. Builds on calltype_protocol (crypto + wire format). Pure Dart, no Flutter SDK, so headless bots can reuse it."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.0

# Keep this list Flutter-free: anything that pulls the Flutter SDK (even
# transitively, like signalr_netcore does) breaks `dart run` for src/bots.
dependencies:
  # Crypto and wire format; re-exported under crypto/ and messaging/ so
  # older imports keep working.
  calltype_protocol:
    path: ../calltype_protocol
  dio: ^5.9.2
  drift: ^2.35.4
  crypto: ^3.0.8
  cryptography: ^2.9.0

dev_dependencies:
  test: ^1.33.0
  lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.33.0
