name: calltype
description: "End-to-end encrypted multiplatform messenger."
publish_to: 'none'
# major.minor.patch is the release version, bumped by hand before a release.
# +N is ignored by CI; build numbers come from .github/scripts/version.sh
# (commit count), so every platform and the web share one number per SHA.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  # Pure-Dart protocol core (crypto, sessions, REST + SignalR), shared with
  # the headless bots in src/bots.
  calltype_core:
    path: ../calltype_core

  flutter:
    sdk: flutter
  # UI language follows the OS / browser locale (see l10n.yaml, lib/l10n).
  flutter_localizations:
    sdk: flutter
  # usePathUrlStrategy() for web App Links / QR URLs without '#' (stream G,
  # contracts K13).
  flutter_web_plugins:
    sdk: flutter

  # UI / Navigation
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  provider: ^6.1.5+1

  # Networking
  dio: ^5.9.2
  signalr_netcore: ^1.4.4

  # Push notifications (requires Firebase project config at deploy time)
  firebase_messaging: ^15.2.4
  firebase_core: ^3.13.0
  # Local notifications, badge and direct web APIs (stream N). fln 22 needs
  # Android core library desugaring (android/app/build.gradle.kts).
  flutter_local_notifications: ^22.3.1
  app_badge_plus: ^1.3.5
  web: ^1.1.1

  # WebRTC (voice/video calls)
  flutter_webrtc: 1.5.2
  # Native incoming-call UI (CallKit / Telecom), stream C. Android + iOS only;
  # its iOS 15.0 minimum is why the deployment target is 15.0.
  flutter_callkit_incoming: ^3.1.6
  # Upper bounds on audioplayers / wakelock_plus / proximity_sensor are
  # deliberate: the next minor of each requires Flutter >= 3.44 and CI builds
  # with 3.41 (contracts K11). Do not use APIs added after these ranges.
  audioplayers: ">=6.7.1 <6.8.0"
  wakelock_plus: ">=1.7.0 <1.8.0"
  proximity_sensor: ">=1.4.0 <2.0.0"
  connectivity_plus: ^7.3.1
  window_manager: ^0.5.2

  # Local storage & security
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.1
  drift: ^2.33.0
  # No sqlite3_flutter_libs: since sqlite3 3.x the native library comes from
  # the sqlite3 package's build hooks, and 0.6.0+eol is an empty package
  # (drift_flutter still pulls it in transitively, which is harmless).
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5

  # QR code scanning & generation (contact exchange)
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

  # Sharing / file handling
  share_plus: ^13.1.0
  file_picker: ^12.3.0
  image_picker: ^1.2.2

  # Media messages (stream M2): voice notes, video, thumbnails, gallery save.
  # record 7.x and video_player >= 2.12 require Flutter >= 3.44 (Dart 3.12);
  # CI builds with 3.41, so the newest compatible lines are pinned instead of
  # the contract's ^7.1.1 / ^2.14.0 (X0 deviation, see gap-contracts §6.2).
  record: ^6.2.1
  video_player: ">=2.11.1 <2.12.0"
  video_player_win: ^3.3.0
  get_thumbnail_video: ^0.7.3
  gal: ^2.3.3
  image: ^4.10.1
  # 0.3.x on purpose: image_picker / file_picker still expose 0.3 XFile.
  cross_file: ^0.3.5
  mime: ^2.0.0

  # Screenshot / app-switcher protection (stream S).
  screen_protector: ^1.5.3
  # gzip of backup payloads (stream D).
  archive: ^4.0.0
  # Version label in settings and update check (stream P).
  package_info_plus: ^10.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4
  # Tests install a keychain fake that honors accessibility attributes
  # (test/core/storage/secure_storage_test.dart).
  flutter_secure_storage_platform_interface: ^2.0.1
  # Windows MSIX packaging (`dart run msix:create`, stream P).
  msix: ^3.18.0

flutter:
  uses-material-design: true
  # Runs gen-l10n on `flutter pub get` / build; the generated
  # lib/l10n/app_localizations*.dart files are not committed.
  generate: true
  assets:
    # Only the opaque mark ships in the app; the other masters are build-time
    # inputs for flutter_launcher_icons.
    - assets/brand/jay-icon.png
    # Call tones (ringtone, ringback, busy, end). Files land with stream C
    # (C05); the directory ships with a .gitkeep so the build resolves now.
    - assets/sounds/

# App icons for every platform are generated from the Jay brand mark
# (master PNGs in assets/brand, rendered from www/assets/jay-mark.svg).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/jay-icon.png"
  android: "ic_launcher"
  # Adaptive icon: the mark sits inside the 66 % safe zone so launcher masks
  # (circle, squircle) never clip the beak.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/jay-icon-foreground.png"
  ios: true
  remove_alpha_ios: true   # App Store rejects icons with an alpha channel
  web:
    generate: true
    image_path: "assets/brand/jay-icon-maskable.png"
    background_color: "#FFFFFF"
    theme_color: "#003840"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
