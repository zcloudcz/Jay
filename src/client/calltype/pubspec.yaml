name: calltype
description: "End-to-end encrypted multiplatform messenger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  # Pure-Dart protocol core (crypto, sessions, REST + SignalR), shared with
  # the headless bots in src/bots.
  calltype_core:
    path: ../calltype_core

  flutter:
    sdk: flutter
  # UI language follows the OS / browser locale (see l10n.yaml, lib/l10n).
  flutter_localizations:
    sdk: flutter

  # UI / Navigation
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  provider: ^6.1.5+1

  # Networking
  dio: ^5.9.2
  signalr_netcore: ^1.4.4

  # Push notifications (requires Firebase project config at deploy time)
  firebase_messaging: ^15.2.4
  firebase_core: ^3.13.0

  # WebRTC (voice/video calls)
  flutter_webrtc: 1.5.2

  # Local storage & security
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.1
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5

  # QR code scanning & generation (contact exchange)
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

  # Sharing / file handling
  share_plus: ^13.1.0
  file_picker: ^12.3.0
  image_picker: ^1.2.2
  # Re-encodes picked photos to a small JPEG without EXIF/GPS before they go
  # into an end-to-end encrypted attachment (pure Dart, so it runs in an
  # isolate and on web alike). Already in the tree via flutter_launcher_icons.
  image: ^4.10.1
  # Saves received photos into the iOS / Android photo library; FilePicker's
  # save dialog only reaches the Files app there.
  gal: ^2.3.3
  # Opens the public channel rules page (the app had no external links
  # before; the rules are a web page so they stay one legal text).
  url_launcher: ^6.3.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_local_notifications: ^22.3.3
  web: ^1.1.1
  emoji_picker_flutter: ^4.5.4
  record: ^6.2.1
  audioplayers: ^6.7.1
  video_player: ^2.11.1
  fc_native_video_thumbnail: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Runs gen-l10n on `flutter pub get` / build; the generated
  # lib/l10n/app_localizations*.dart files are not committed.
  generate: true
  assets:
    # Only the opaque mark ships in the app; the other masters are build-time
    # inputs for flutter_launcher_icons.
    - assets/brand/jay-icon.png

# App icons for every platform are generated from the Jay brand mark
# (master PNGs in assets/brand, rendered from www/assets/jay-mark.svg).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/jay-icon.png"
  android: "ic_launcher"
  # Adaptive icon: the mark sits inside the 66 % safe zone so launcher masks
  # (circle, squircle) never clip the beak.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/jay-icon-foreground.png"
  ios: true
  remove_alpha_ios: true   # App Store rejects icons with an alpha channel
  web:
    generate: true
    image_path: "assets/brand/jay-icon-maskable.png"
    background_color: "#FFFFFF"
    theme_color: "#003840"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
