[package]
name = "calltype_signal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# libsignal-protocol will be added when the exact compatible version is confirmed.
# For now we only use rand + libc to produce placeholder FFI functions that
# return random keys in JSON form — enough for the Dart side to develop against.
rand = "0.8"
libc = "0.2"
base64 = "0.22"
serde_json = "1"
