# 4G heap, not 8G: the hosted CI runner has 16 GB for the Gradle daemon, the
# Kotlin daemon and the native (NDK/CMake) plugin builds together, and the
# release APK job died mid-build with an 8G heap and 4G metaspace (deploy run
# 42299206210, runner shutdown signal after 12 min of assembleRelease).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
