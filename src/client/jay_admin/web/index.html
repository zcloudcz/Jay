<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web --base-href /admin/` (deploy.yml). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jay operator web: channel moderation.">
  <!-- The page must never be indexed or leak its URL (with the hash route of
       a case) as a Referer to the rules page or anywhere else. The Static Web
       App also sends X-Robots-Tag: noindex for /admin/*. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Jay moderation</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
