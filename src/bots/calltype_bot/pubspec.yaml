name: calltype_bot
description: "Headless CallType (Jay) bot runtime: an ordinary E2E device driven by a message handler. Pure Dart, no Flutter SDK."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  calltype_core:
    path: ../../client/calltype_core
  crypto: ^3.0.8
  dio: ^5.9.2
  drift: ^2.35.4

dev_dependencies:
  test: ^1.33.0
  lints: ^6.0.0
