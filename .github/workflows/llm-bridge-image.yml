# ---------------------------------------------------------------------------
# llm_bridge Docker image -> ghcr.io (manual, SHA-pinned)
# ---------------------------------------------------------------------------
# Why: "New bot" in the app offers Docker as one of the targets; the setup
# script (infra/bots/jay-new-bot.sh --docker) pulls this image instead of a
# native bundle. API providers only (anthropic, openai); the CLI providers
# need the owner's own signed-in CLI on the host.
#
# One-time: after the first push, make the package public in GitHub package
# settings (ghcr.io/zcloudcz/jay-llm-bridge), otherwise hosts need a login.
#
# Run it manually (workflow_dispatch) with a commit SHA.
# ---------------------------------------------------------------------------

name: LLM bridge image

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to build'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      # GitHub expressions have no substring function, so the short tag is
      # computed in a step.
      - id: tag
        run: echo "short=${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # driver: docker uses the runner's own engine instead of pulling the
      # moby/buildkit image from Docker Hub, which timed out (run 37993841440).
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Context is src/ because the Dockerfile uses path dependencies.
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/bots/llm_bridge/Dockerfile
          push: true
          tags: |
            ghcr.io/zcloudcz/jay-llm-bridge:latest
            ghcr.io/zcloudcz/jay-llm-bridge:${{ steps.tag.outputs.short }}
