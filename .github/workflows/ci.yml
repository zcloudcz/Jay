name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]
    paths: ['src/**', '.github/workflows/ci.yml']
  push:
    branches: [main, master, develop]
    paths: ['src/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build and test API with PostgreSQL and Azurite
        run: dotnet test src/server/CallType.Api.Tests --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults
          retention-days: 14

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  beta-build:
    needs: [backend, flutter]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            command: flutter build web --release
            artifact: build/web
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - platform: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/calltype-macos.tar.gz
          - platform: ios-unsigned
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/calltype-ios-unsigned.tar.gz
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build beta artifact
        run: ${{ matrix.command }} --dart-define=API_BASE_URL=${{ vars.CALLTYPE_API_BASE_URL || 'http://localhost:8080' }}
      - name: Archive macOS bundle preserving executable permissions
        if: matrix.platform == 'macos'
        run: tar -czf build/calltype-macos.tar.gz -C build/macos/Build/Products/Release .
      - name: Archive unsigned iOS bundle
        if: matrix.platform == 'ios-unsigned'
        run: tar -czf build/calltype-ios-unsigned.tar.gz -C build/ios/iphoneos .
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-beta-${{ matrix.platform }}-${{ github.sha }}
          path: src/client/calltype/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
