name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]
    paths: ['src/**', 'infra/**', '.github/workflows/ci.yml', '.github/workflows/deploy.yml']
  push:
    branches: [main, master, develop]
    paths: ['src/**', 'infra/**', '.github/workflows/ci.yml', '.github/workflows/deploy.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build and test API with PostgreSQL and Azurite
        run: dotnet test src/server/CallType.Api.Tests --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults
          retention-days: 14
      # N06: dotnet list --vulnerable exits 0 even when it finds something,
      # so infra/ci/check-dotnet-vulnerable.sh parses its output and fails
      # explicitly. Same script runs locally — see docs/security/vulnerability-management.md.
      - name: Fail on known vulnerable NuGet packages (N06)
        run: |
          chmod +x infra/ci/check-dotnet-vulnerable.sh
          infra/ci/check-dotnet-vulnerable.sh src/server/CallType.Api src/server/CallType.Audit src/server/CallType.Api.Tests

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      # The app's drift schema lives in the pure-Dart core package and its
      # *.g.dart is not committed, so it must be generated before the app
      # can be analyzed or built.
      - name: calltype_core codegen + tests
        working-directory: src/client/calltype_core
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          dart analyze
          dart test
      # Headless bots reuse the generated core above, so they run right after
      # it in this job. `dart build cli` proves the bridge stays Flutter-free
      # and links the native SQLite (what the Dockerfile does).
      - name: calltype_bot analyze + tests
        working-directory: src/bots/calltype_bot
        run: |
          dart pub get
          dart analyze
          dart test
      - name: jay_archiver analyze + tests
        working-directory: src/bots/jay_archiver
        run: |
          dart pub get
          dart analyze
          dart test
      - name: hermes_bridge analyze + tests + headless build
        working-directory: src/bots/hermes_bridge
        run: |
          dart pub get
          dart analyze
          dart test
          dart build cli -o build/out
      - name: llm_bridge analyze + tests + headless build
        working-directory: src/bots/llm_bridge
        run: |
          dart pub get
          dart analyze
          dart test
          dart build cli -o build/out
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      # Operator web (contract section 8). Independent of calltype_core, so
      # it needs no codegen; widget tests run against a fake /admin API.
      - name: jay_admin analyze + tests
        working-directory: src/client/jay_admin
        run: |
          flutter pub get
          flutter analyze
          flutter test
      # N06: OSV-Scanner over every pub lockfile. The action's own CLI fails
      # (non-zero exit) as soon as it finds a known vulnerability that isn't
      # in osv-scanner.toml's dated allow-list — that failure blocks this job.
      # `uses:` steps ignore the job's `defaults.run.working-directory` (that
      # only applies to `run:` steps), so paths here are relative to the repo
      # root, not to src/client/calltype like the steps above.
      - name: OSV-Scanner over Dart/Flutter lockfiles (N06)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./src/client/calltype/pubspec.lock
            --lockfile=./src/client/calltype_core/pubspec.lock
            --lockfile=./src/client/jay_admin/pubspec.lock
            --lockfile=./src/bots/calltype_bot/pubspec.lock
            --lockfile=./src/bots/hermes_bridge/pubspec.lock
            --lockfile=./src/bots/jay_archiver/pubspec.lock
            --lockfile=./src/bots/llm_bridge/pubspec.lock
            --config=./osv-scanner.toml

  # Bot setup one-liners (spec 2026-11-09-bot-factory, B6): shellcheck, the
  # --dry-run matrix (every provider x Linux/macOS/Docker, no secret in the
  # output) and the PowerShell parse + -DryRun matrix. The hosted Ubuntu
  # runner ships shellcheck and pwsh; nothing is installed or started.
  bot-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: infra/bots/test-scripts.sh

  # Bicep lint gate: any change under infra/ must at least compile. This does
  # NOT run `az deployment ... what-if` or touch Azure — that stays a manual,
  # read-only step owned by I01. `az bicep build` alone needs no Azure login.
  infra-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find and build every Bicep template
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(infra/**/*.bicep)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .bicep files present yet — nothing to validate."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "az bicep build --file $f"
            az bicep build --file "$f" --outfile "$(mktemp).json"
          done

  # Sanity build only — proves the app still compiles for every target platform.
  # NOT a distributable artifact: it uses a placeholder, non-production API URL
  # and is never picked up by deploy.yml. Real beta/release artifacts with a
  # validated production API URL are built exclusively by deploy.yml's
  # `build` job against an explicit, tested commit SHA (see R01 acceptance
  # criteria in docs/superpowers/plans/2026-09-16-beta-vyvoj.md).
  dev-build:
    needs: [backend, flutter]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            command: flutter build web --release
            artifact: build/web
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - platform: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/calltype-macos.tar.gz
          - platform: ios-unsigned
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/calltype-ios-unsigned.tar.gz
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      # The app's drift schema lives in the pure-Dart core package and its
      # *.g.dart is not committed, so it must be generated before the app
      # can be analyzed or built.
      - name: calltype_core codegen
        working-directory: src/client/calltype_core
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # FCM (notifications spec 2026-11-06): the Firebase Android config comes
      # from an OPTIONAL secret. Unset = the APK builds without the Google
      # services plugin, push reports "not configured" and local notifications
      # still work. Passed through env only, never echoed.
      - name: Firebase config for Android (optional secret)
        if: matrix.platform == 'android'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set: building without FCM."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 -c 'import json, sys; json.load(open(sys.argv[1]))' android/app/google-services.json \
            || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not the base64 of a JSON file."; exit 1; }
          echo "Wrote android/app/google-services.json (FCM enabled in this build)."
      - name: Build sanity artifact (placeholder API URL, never distributed)
        run: ${{ matrix.command }} --dart-define=API_BASE_URL=https://ci-sanity-build.invalid
      # Same layout as deploy.yml: the operator web under build/web/admin.
      - name: Build operator web sanity artifact into build/web/admin
        if: matrix.platform == 'web'
        shell: bash
        run: |
          set -euo pipefail
          (cd ../jay_admin && flutter pub get && flutter build web --release --base-href /admin/ --dart-define=CALLTYPE_API_BASE_URL=https://ci-sanity-build.invalid)
          rm -rf build/web/admin
          cp -r ../jay_admin/build/web build/web/admin
          grep -q '<base href="/admin/">' build/web/admin/index.html
      - name: Archive macOS bundle preserving executable permissions
        if: matrix.platform == 'macos'
        run: tar -czf build/calltype-macos.tar.gz -C build/macos/Build/Products/Release .
      - name: Archive unsigned iOS bundle
        if: matrix.platform == 'ios-unsigned'
        run: tar -czf build/calltype-ios-unsigned.tar.gz -C build/ios/iphoneos .
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-ci-sanity-${{ matrix.platform }}-${{ github.sha }}
          path: src/client/calltype/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 3
