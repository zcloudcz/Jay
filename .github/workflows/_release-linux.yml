# Stub for P8 (stream P). It exists so release-native.yml is a valid
# dispatcher from the first commit; P8 replaces the job with the real
# linux build. Fails loudly instead of pretending to have built anything.

name: Release linux (reusable)

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::linux release is not implemented yet (P8)."
          exit 1
