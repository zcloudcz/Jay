# Stub for P5 (stream P). It exists so release-native.yml is a valid
# dispatcher from the first commit; P5 replaces the job with the real
# ios build. Fails loudly instead of pretending to have built anything.

name: Release ios (reusable)

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      upload:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::ios release is not implemented yet (P5)."
          exit 1
