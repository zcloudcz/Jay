# ---------------------------------------------------------------------------
# iOS TestFlight — manual, SHA-pinned signed build + upload
# ---------------------------------------------------------------------------
# Kept separate from deploy.yml on purpose: macOS runner minutes are billed at
# 10x, and a TestFlight upload is only needed when testers should get a new
# native build, not on every web/API deploy.
#
# Signing model: Apple "cloud signing". `xcodebuild archive` signs with a
# cloud-managed development certificate, then `xcodebuild -exportArchive`
# re-signs for distribution and uploads, both using an App Store Connect
# API key with -allowProvisioningUpdates. Apple manages the distribution
# certificate and provisioning profile, so no .p12 / .mobileprovision is ever
# stored here.
#
# One-time setup by the account owner (names only — never commit values):
#   App Store Connect > Users and Access > Integrations > App Store Connect API:
#     create a Team key with the "Admin" role (App Manager fails with "Cloud signing permission error"),
#     download AuthKey_XXXXXXXXXX.p8 once.
#   App Store Connect > Apps: create the app with bundle ID cz.zcloud.jay
#     (register the identifier under Certificates, IDs & Profiles first).
#   GitHub environment "apple-testflight":
#     secrets   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (base64 of the .p8)
#     variable  APPLE_TEAM_ID (10-character team id)
#   Repository variable CALLTYPE_API_BASE_URL is shared with deploy.yml.
# ---------------------------------------------------------------------------

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to build and upload (use one that already passed deploy.yml)'
        required: true
        type: string

permissions:
  contents: read

# Two uploads racing for the same build number would make App Store Connect
# reject the second one; serialize instead of cancelling a running upload.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: apple-testflight
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Refuse to build without signing inputs or with an unusable API URL
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Fail before spending ~20 macOS minutes on a build that cannot be signed.
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set in environment apple-testflight."; exit 1; }
          done
          [ -n "${{ vars.APPLE_TEAM_ID }}" ] || { echo "::error::Variable APPLE_TEAM_ID is not set."; exit 1; }
          URL="${{ vars.CALLTYPE_API_BASE_URL }}"
          case "$URL" in
            https://*) ;;
            *) echo "::error::CALLTYPE_API_BASE_URL must be a public HTTPS URL, got: '$URL'"; exit 1 ;;
          esac
          case "$URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*::1*) echo "::error::CALLTYPE_API_BASE_URL is a loopback address."; exit 1 ;;
          esac

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      # The app's drift schema lives in the pure-Dart core package and its
      # *.g.dart is not committed, so it must be generated before the app
      # can be analyzed or built.
      - name: calltype_core codegen
        working-directory: src/client/calltype_core
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # The build number must strictly increase for every upload of the same
      # marketing version; the workflow run number gives that for free.
      # The archive is signed at build time: an unsigned archive
      # (`flutter build ipa --no-codesign`) exports fine but App Store Connect
      # rejects it with "Invalid Signature" for Runner and every framework
      # (run 37956965796). So Flutter only writes the Xcode config here and
      # xcodebuild archives with automatic signing + the API key.
      # The identity is forced to "Apple Distribution" because a development
      # profile needs at least one registered device and the team has none
      # (run 37960436598); the project's sdk-conditional "iPhone Developer"
      # value is overridden too.
      - name: Archive, sign with cloud-managed certificate and upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          # Written to the runner temp dir only and removed on exit, so the key
          # never lands in the workspace or in an uploaded artifact.
          trap 'rm -rf "$KEY_DIR"' EXIT
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Generates ios/Flutter/Generated.xcconfig (build number, dart
          # defines) and runs pod install, without building anything.
          # --no-codesign only skips Flutter's own local certificate check: the
          # runner has no certificate until xcodebuild fetches a cloud one below.
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.CALLTYPE_API_BASE_URL }}

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution" \
            "${AUTH[@]}"

          sed "s/__TEAM_ID__/$TEAM_ID/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            "${AUTH[@]}"

      - name: Summary
        if: success()
        run: |
          echo "Uploaded build ${{ github.run_number }} of commit ${{ inputs.commit_sha }} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes ~5-15 min; then add the build to a TestFlight group. Export-compliance must be answered once per build unless ITSAppUsesNonExemptEncryption is set in Info.plist." >> "$GITHUB_STEP_SUMMARY"
