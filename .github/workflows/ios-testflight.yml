# ---------------------------------------------------------------------------
# iOS TestFlight — manual, SHA-pinned signed build + upload
# ---------------------------------------------------------------------------
# Kept separate from deploy.yml on purpose: macOS runner minutes are billed at
# 10x, and a TestFlight upload is only needed when testers should get a new
# native build, not on every web/API deploy.
#
# Signing model: manual, same as zDrive (scripts/Build-IosRelease.sh there).
# The team's "Apple Distribution" certificate (.p12, shared with zDrive — one
# team, DZR3FD9ZNT) and the "Jay App Store" provisioning profile are imported
# into a throwaway keychain; only the Runner target is switched to manual
# signing, then archive -> export -> `altool` upload with the ASC API key.
# Cloud signing was tried first and abandoned (2026-10-09): an unsigned archive
# is rejected with "Invalid Signature", and signing the archive automatically
# needs a development profile, which needs a registered device.
#
# One-time setup by the account owner (names only — never commit values):
#   App Store Connect > Users and Access > Integrations > App Store Connect API:
#     create a Team key (Admin), download AuthKey_XXXXXXXXXX.p8 once.
#   Certificates, IDs & Profiles: App ID cz.zcloud.jay with the Push
#     Notifications capability; Profiles > App Store Connect profile
#     "Jay App Store" for that App ID and the team's Apple Distribution
#     certificate (no devices needed). Regenerate the profile after enabling
#     Push: Runner.entitlements needs aps-environment=production in it.
#   GitHub environment "apple-testflight":
#     secrets   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (base64 of the .p8),
#               IOS_CERTIFICATE_BASE64 + IOS_CERTIFICATE_PASSWORD (the .p12),
#               IOS_PROVISION_PROFILE_BASE64 (the .mobileprovision)
#     variable  APPLE_TEAM_ID (10-character team id)
#   Repository variable CALLTYPE_API_BASE_URL is shared with deploy.yml.
# ---------------------------------------------------------------------------

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to build and upload (use one that already passed deploy.yml)'
        required: true
        type: string

permissions:
  contents: read

# Two uploads racing for the same build number would make App Store Connect
# reject the second one; serialize instead of cancelling a running upload.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: apple-testflight
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Refuse to build without signing inputs or with an unusable API URL
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Fail before spending ~20 macOS minutes on a build that cannot be signed.
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set in environment apple-testflight."; exit 1; }
          done
          [ -n "${{ vars.APPLE_TEAM_ID }}" ] || { echo "::error::Variable APPLE_TEAM_ID is not set."; exit 1; }
          URL="${{ vars.CALLTYPE_API_BASE_URL }}"
          case "$URL" in
            https://*) ;;
            *) echo "::error::CALLTYPE_API_BASE_URL must be a public HTTPS URL, got: '$URL'"; exit 1 ;;
          esac
          case "$URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*::1*) echo "::error::CALLTYPE_API_BASE_URL is a loopback address."; exit 1 ;;
          esac

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.x'
          cache: true
      # The app's drift schema lives in the pure-Dart core package and its
      # *.g.dart is not committed, so it must be generated before the app
      # can be analyzed or built.
      - name: calltype_core codegen
        working-directory: src/client/calltype_core
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # The build number must strictly increase for every upload of the same
      # marketing version; the workflow run number gives that for free.
      - name: Archive with manual signing and upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          BUNDLE_ID=cz.zcloud.jay
          # Everything secret is written to the runner temp dir only and removed
          # on exit (keychain included), so nothing lands in the workspace or in
          # an uploaded artifact.
          WORK="$(mktemp -d "$RUNNER_TEMP/jay-ios.XXXXXX")"
          KEYCHAIN="$WORK/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          INSTALLED_PROFILE=""
          cleanup() {
            [ -n "$INSTALLED_PROFILE" ] && rm -f "$INSTALLED_PROFILE"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$WORK/cert.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$WORK/profile.mobileprovision"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$WORK/AuthKey_${ASC_KEY_ID}.p8"

          # Throwaway keychain; set-key-partition-list lets codesign use the
          # private key without a UI prompt (there is nobody to click "Allow").
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$WORK/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          # Check the profile is the one for this app and team before ~15 min of build.
          security cms -D -i "$WORK/profile.mobileprovision" -o "$WORK/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$WORK/profile.plist")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$WORK/profile.plist")"
          [ "$PROFILE_APP_ID" = "$TEAM_ID.$BUNDLE_ID" ] || { echo "::error::Profile is for $PROFILE_APP_ID, expected $TEAM_ID.$BUNDLE_ID"; exit 1; }
          # Runner.entitlements declares aps-environment=production (APNs push,
          # notifications spec 2026-11-06). A profile generated before Push was
          # enabled on the App ID lacks it and the archive would fail late.
          PROFILE_APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$WORK/profile.plist" 2>/dev/null || true)"
          [ "$PROFILE_APS" = "production" ] || { echo "::error::Profile has no aps-environment=production (got '$PROFILE_APS'). Enable Push Notifications on the App ID, regenerate the \"Jay App Store\" profile and update IOS_PROVISION_PROFILE_BASE64."; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          INSTALLED_PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$WORK/profile.mobileprovision" "$INSTALLED_PROFILE"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          [ -n "$SIGNING_IDENTITY" ] || { echo "::error::No code-signing identity in IOS_CERTIFICATE_BASE64."; exit 1; }

          # Generates ios/Flutter/Generated.xcconfig (build number, dart
          # defines) and runs pod install, without building anything.
          # --no-codesign only skips Flutter's own local certificate check.
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.CALLTYPE_API_BASE_URL }}

          # Manual signing on the Runner target only. Passing these as
          # xcodebuild arguments would apply them to every Pods target too,
          # and frameworks cannot use an app's provisioning profile.
          # The xcodeproj gem ships with CocoaPods on the runner.
          ruby -r xcodeproj -e '
            team, identity, profile = ARGV
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            target = project.targets.find { |t| t.name == "Runner" } or abort "Runner target not found"
            config = target.build_configurations.find { |c| c.name == "Release" } or abort "Release config not found"
            config.build_settings["CODE_SIGN_STYLE"] = "Manual"
            config.build_settings["DEVELOPMENT_TEAM"] = team
            config.build_settings["CODE_SIGN_IDENTITY"] = identity
            config.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = identity
            config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = profile
            project.save
          ' "$TEAM_ID" "$SIGNING_IDENTITY" "$PROFILE_UUID"

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive

          sed -e "s/__TEAM_ID__/$TEAM_ID/" -e "s/__PROFILE_UUID__/$PROFILE_UUID/" \
            ios/ci/ExportOptions.plist > "$WORK/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$WORK/ExportOptions.plist" \
            -exportPath build/ios/ipa

          # altool finds AuthKey_<id>.p8 through API_PRIVATE_KEYS_DIR.
          IPA=(build/ios/ipa/*.ipa)
          [ ${#IPA[@]} -eq 1 ] && [ -f "${IPA[0]}" ] || { echo "::error::Expected exactly one .ipa"; exit 1; }
          API_PRIVATE_KEYS_DIR="$WORK" xcrun altool --upload-app --type ios \
            --file "${IPA[0]}" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Summary
        if: success()
        run: |
          echo "Uploaded build ${{ github.run_number }} of commit ${{ inputs.commit_sha }} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes ~5-15 min; then add the build to a TestFlight group. Export-compliance must be answered once per build unless ITSAppUsesNonExemptEncryption is set in Info.plist." >> "$GITHUB_STEP_SUMMARY"
