# Stub for P4 (stream P). It exists so release-native.yml is a valid
# dispatcher from the first commit; P4 replaces the job with the real
# android build. Fails loudly instead of pretending to have built anything.

name: Release android (reusable)

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      play_track:
        description: 'none | internal'
        required: false
        type: string
        default: none

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::android release is not implemented yet (P4)."
          exit 1
