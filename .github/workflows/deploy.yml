# ---------------------------------------------------------------------------
# Deploy — manual, SHA-pinned release to the existing CallType beta
# ---------------------------------------------------------------------------
# This workflow replaces an earlier version that built a Docker image and
# deployed to Azure Container Apps/ACR — infrastructure that does not exist
# for this beta (see docs/azure-beta-plan.md and beta-infrastruktura.md).
#
# The real beta is:
#   - API:  App Service "calltype-beta-zahy" in resource group "rg-calltype-beta"
#   - Web:  Static Web App "calltype-beta-web"
# Both already exist. This workflow deploys code to them and REFUSES to run
# if either is missing — it never provisions replacement infrastructure
# (that is I01's job, in infra/, not this workflow's).
#
# Required repository configuration (names only — set the actual values in
# GitHub Settings > Secrets and variables):
#   Variables (non-secret):
#     AZURE_RESOURCE_GROUP     — e.g. rg-calltype-beta
#     AZURE_WEBAPP_NAME        — e.g. calltype-beta-zahy
#     AZURE_SWA_NAME           — e.g. calltype-beta-web (documentation only; the
#                                 SWA deploy action addresses the app via its
#                                 deployment token, not this name)
#     CALLTYPE_API_BASE_URL    — public HTTPS URL of the deployed API, used to
#                                 compile the web/mobile/desktop clients
#   Secrets:
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#                              — federated (OIDC) service principal for azure/login;
#                                no client secret is stored (see azure/login docs
#                                for "Federated credential" App Registration setup)
#     AZURE_SWA_DEPLOYMENT_TOKEN
#                              — Static Web Apps deploy action still only supports
#                                a deployment token, not OIDC; scope it to this SWA
#     FIREBASE_CLIENT_CONFIG_JSON_B64
#                              — optional; base64 of the flat FIREBASE_* JSON
#                                (gap-platform.md §9). Without it the web build
#                                has no push (PushStatus.notConfigured).
#   Old ACR_LOGIN_SERVER/ACR_USERNAME/ACR_PASSWORD/AZURE_CREDENTIALS secrets are
#   no longer used by this workflow and should be removed from the repo.
#
# Native clients (Android, iOS, macOS, Windows, Linux) are no longer built
# here: signing and store uploads need their own environments and macOS
# minutes should not be spent on every web deploy. They are released with
# release-native.yml, which uses the same version.sh so the web and the store
# builds of one SHA carry the same build number.
# ---------------------------------------------------------------------------

name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to test, build and deploy (never a branch name — must be exact so artifacts and deploy match)'
        required: true
        type: string
      confirm_backup:
        description: 'I have taken (or confirmed via the I02 runbook) a database backup immediately before this deploy'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Only one deploy of this environment at a time. Do NOT cancel-in-progress:
# the App Service B1 plan has no deployment slots, so a cancelled deploy can
# leave the app mid-swap with no safe rollback target.
concurrency:
  group: deploy-calltype-beta
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm the SHA exists and confirm_backup was checked
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_backup }}" != "true" ]; then
            echo "::error::confirm_backup was not checked. Take a backup per docs/ops/postgres-restore.md (I02 runbook) before deploying, then re-run with the box checked."
            exit 1
          fi
          if ! git cat-file -e "${{ inputs.commit_sha }}^{commit}" 2>/dev/null; then
            echo "::error::'${{ inputs.commit_sha }}' is not a commit reachable in this repository. Pass a full commit SHA, not a branch or tag name."
            exit 1
          fi

  # Re-run the same gates as ci.yml, pinned to the exact SHA being released.
  # This guarantees the tests that gate this deploy ran against the bytes
  # that will actually be built and shipped below, not whatever HEAD is now.
  # Backend here; the Flutter gate is the reusable _client-tests.yml, shared
  # with release-native.yml (a reusable workflow cannot run inside a job).
  test:
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Backend tests
        run: dotnet test src/server/CallType.Api.Tests --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-backend-test-results-${{ inputs.commit_sha }}
          path: TestResults
          retention-days: 30

  client-tests:
    needs: validate-inputs
    uses: ./.github/workflows/_client-tests.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  # One build name/number per SHA, shared with release-native.yml (P2). The
  # web may be deployed from a branch commit (integration deploys), so the
  # master-ancestor rule is only a warning here; store releases keep it strict.
  version:
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          JAY_ALLOW_NON_MASTER: 'true'
        run: bash .github/scripts/version.sh "$COMMIT_SHA"

  # N06: CycloneDX SBOM for every Dart/Flutter package, generated once (not
  # once per build-clients matrix leg) and uploaded next to the other release
  # artifacts. Reuses OSV-Scanner (already pinned above for ci.yml's vuln
  # gate) rather than trusting a second tool: it can emit CycloneDX directly,
  # so there is no new npm-based tool (e.g. cdxgen) to vet. As a side effect
  # this step also blocks the release on a known vulnerability in any pub
  # lockfile, which is a deliberate extra release gate, not a bug.
  sbom-dart:
    needs: [test, client-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Generate Dart/Flutter SBOM (CycloneDX via OSV-Scanner, N06)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./src/client/calltype/pubspec.lock
            --lockfile=./src/client/calltype_core/pubspec.lock
            --lockfile=./src/bots/calltype_bot/pubspec.lock
            --lockfile=./src/bots/hermes_bridge/pubspec.lock
            --lockfile=./src/bots/jay_archiver/pubspec.lock
            --config=./osv-scanner.toml
            --format=cyclonedx-1-5
            --output=./dart-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-release-dart-sbom-${{ inputs.commit_sha }}
          path: dart-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  build-api:
    needs: [test, client-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish API
        run: dotnet publish src/server/CallType.Api -c Release -o publish/api
      - name: Zip publish output (this is what gets deployed — deploy the bytes we tested)
        run: (cd publish/api && zip -r ../../calltype-api.zip .)
      - name: Write build manifest
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_VER=$(dotnet --version)
          SHA256=$(sha256sum calltype-api.zip | cut -d' ' -f1)
          cat > api-manifest.json <<EOF
          {
            "commitSha": "${{ inputs.commit_sha }}",
            "platform": "api",
            "dotnetVersion": "$DOTNET_VER",
            "artifactSha256": "$SHA256"
          }
          EOF
      # N06: CycloneDX SBOM for the released API, attached next to the
      # manifest. `dotnet tool install` and `dotnet CycloneDX` both fail the
      # step (and therefore the job) on error — nothing here is best-effort.
      - name: Generate API SBOM (CycloneDX, N06)
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          # Point at the .csproj, not the folder: given a directory the tool
          # exits 0 with an EMPTY component list (verified locally, 6.2.0).
          dotnet CycloneDX src/server/CallType.Api/CallType.Api.csproj -o . -fn api-sbom.cdx.json -F Json
          # An SBOM with no components is a silent failure — refuse it.
          grep -q '"purl"' api-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-release-api-${{ inputs.commit_sha }}
          path: |
            calltype-api.zip
            api-manifest.json
            api-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  # Web distribution build. Unlike ci.yml's dev-build, it refuses to build
  # without a real, non-local production API URL — an artifact with a
  # localhost/HTTP fallback baked in must never leave this workflow.
  build-web:
    needs: [test, client-tests, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Refuse an unusable production API URL
        env:
          API_URL: ${{ vars.CALLTYPE_API_BASE_URL }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-api-url.sh" "$API_URL"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      # The app's drift schema lives in the pure-Dart core package and its
      # *.g.dart is not committed, so it must be generated before the app
      # can be analyzed or built.
      - name: calltype_core codegen
        working-directory: src/client/calltype_core
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Writes build-defines/firebase.json and, with a complete web config,
      # web/firebase-config.js for the push service worker (P3b).
      - name: Firebase config (P3b)
        env:
          FIREBASE_CLIENT_CONFIG_JSON_B64: ${{ secrets.FIREBASE_CLIENT_CONFIG_JSON_B64 }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/firebase-config.sh" web
      # --build-name/--build-number also land in build/web/version.json, which
      # package_info_plus reads for the version shown in Settings (P2).
      - name: Build release artifact
        env:
          API_URL: ${{ vars.CALLTYPE_API_BASE_URL }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          flutter build web --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=JAY_DISTRIBUTION=web \
            --dart-define=JAY_COMMIT_SHA="$COMMIT_SHA" \
            --dart-define-from-file=build-defines/firebase.json
      - name: Write build manifest (commit, version, tool versions, API URL, artifact hash)
        env:
          API_URL: ${{ vars.CALLTYPE_API_BASE_URL }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/build-manifest.sh" build-manifest.json build/web \
            commitSha="$COMMIT_SHA" platform=web distribution=web \
            buildName="$BUILD_NAME" buildNumber:="$BUILD_NUMBER" apiBaseUrl="$API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-release-web-${{ inputs.commit_sha }}
          path: |
            src/client/calltype/build/web
            src/client/calltype/build-manifest.json
          if-no-files-found: error
          retention-days: 90

  deploy-api:
    needs: build-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: calltype-beta
    permissions:
      id-token: write # required for OIDC azure/login
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calltype-release-api-${{ inputs.commit_sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Fail if the target App Service does not exist (never create replacement infra here)
        run: |
          az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query id -o tsv
      # EF Core migrations run inside the app on startup
      # (Database__ApplyMigrationsOnStartup=true). Safe because the beta runs
      # exactly one B1 instance, so there is never a concurrent migrator; the
      # runner therefore needs no database access or connection-string secret.
      - name: Deploy API package (B1 has no slots — expect a brief outage while the app restarts)
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path calltype-api.zip \
            --type zip

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: calltype-beta
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calltype-release-web-${{ inputs.commit_sha }}
          path: web-artifact
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1.0.0
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: web-artifact/build/web
          skip_app_build: true

  smoke-test:
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API liveness (/health)
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.CALLTYPE_API_BASE_URL }}/health"
      - name: API readiness (/health/ready) — Postgres + Blob reachable
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.CALLTYPE_API_BASE_URL }}/health/ready"
      - name: Web loads
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.CALLTYPE_SWA_URL }}"
      # ponytail: authenticated SignalR negotiate smoke test is a TODO — it needs
      # a real registered device + JWT to negotiate a hub connection, which this
      # workflow does not provision. Until that fixture exists, this step is a
      # documented gap, not a fabricated pass. See docs/acceptance/release-builds.md.
      - name: SignalR smoke test (NOT_RUN — see docs/acceptance/release-builds.md)
        run: echo "SignalR authenticated smoke test not implemented in this workflow; run Q01's manual check before wider distribution."
