# ---------------------------------------------------------------------------
# Deploy — manual, SHA-pinned release to the existing CallType beta
# ---------------------------------------------------------------------------
# This workflow replaces an earlier version that built a Docker image and
# deployed to Azure Container Apps/ACR — infrastructure that does not exist
# for this beta (see docs/azure-beta-plan.md and beta-infrastruktura.md).
#
# The real beta is:
#   - API:  App Service "calltype-beta-zahy" in resource group "rg-calltype-beta"
#   - Web:  Static Web App "calltype-beta-web"
# Both already exist. This workflow deploys code to them and REFUSES to run
# if either is missing — it never provisions replacement infrastructure
# (that is I01's job, in infra/, not this workflow's).
#
# Required repository configuration (names only — set the actual values in
# GitHub Settings > Secrets and variables):
#   Variables (non-secret):
#     AZURE_RESOURCE_GROUP     — e.g. rg-calltype-beta
#     AZURE_WEBAPP_NAME        — e.g. calltype-beta-zahy
#     AZURE_SWA_NAME           — e.g. calltype-beta-web (documentation only; the
#                                 SWA deploy action addresses the app via its
#                                 deployment token, not this name)
#     CALLTYPE_API_BASE_URL    — public HTTPS URL of the deployed API, used to
#                                 compile the web/mobile/desktop clients
#   Secrets:
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#                              — federated (OIDC) service principal for azure/login;
#                                no client secret is stored (see azure/login docs
#                                for "Federated credential" App Registration setup)
#     AZURE_SWA_DEPLOYMENT_TOKEN
#                              — Static Web Apps deploy action still only supports
#                                a deployment token, not OIDC; scope it to this SWA
#   Old ACR_LOGIN_SERVER/ACR_USERNAME/ACR_PASSWORD/AZURE_CREDENTIALS secrets are
#   no longer used by this workflow and should be removed from the repo.
# ---------------------------------------------------------------------------

name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to test, build and deploy (never a branch name — must be exact so artifacts and deploy match)'
        required: true
        type: string
      confirm_backup:
        description: 'I have taken (or confirmed via the I02 runbook) a database backup immediately before this deploy'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Only one deploy of this environment at a time. Do NOT cancel-in-progress:
# the App Service B1 plan has no deployment slots, so a cancelled deploy can
# leave the app mid-swap with no safe rollback target.
concurrency:
  group: deploy-calltype-beta
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm the SHA exists and confirm_backup was checked
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_backup }}" != "true" ]; then
            echo "::error::confirm_backup was not checked. Take a backup per docs/ops/postgres-restore.md (I02 runbook) before deploying, then re-run with the box checked."
            exit 1
          fi
          if ! git cat-file -e "${{ inputs.commit_sha }}^{commit}" 2>/dev/null; then
            echo "::error::'${{ inputs.commit_sha }}' is not a commit reachable in this repository. Pass a full commit SHA, not a branch or tag name."
            exit 1
          fi

  # Re-run the same gates as ci.yml, pinned to the exact SHA being released.
  # This guarantees the tests that gate this deploy ran against the bytes
  # that will actually be built and shipped below, not whatever HEAD is now.
  test:
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Backend tests
        run: dotnet test src/server/CallType.Api.Tests --configuration Release --logger trx --results-directory TestResults
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      - name: Flutter analyze + test
        working-directory: src/client/calltype
        run: |
          # Pure-Dart core first: the app needs its generated drift code.
          (cd ../calltype_core && dart pub get && dart run build_runner build --delete-conflicting-outputs && dart analyze && dart test)
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
          flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-backend-test-results-${{ inputs.commit_sha }}
          path: TestResults
          retention-days: 30

  build-api:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish API
        run: dotnet publish src/server/CallType.Api -c Release -o publish/api
      - name: Zip publish output (this is what gets deployed — deploy the bytes we tested)
        run: (cd publish/api && zip -r ../../calltype-api.zip .)
      - name: Write build manifest
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_VER=$(dotnet --version)
          SHA256=$(sha256sum calltype-api.zip | cut -d' ' -f1)
          cat > api-manifest.json <<EOF
          {
            "commitSha": "${{ inputs.commit_sha }}",
            "platform": "api",
            "dotnetVersion": "$DOTNET_VER",
            "artifactSha256": "$SHA256"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-release-api-${{ inputs.commit_sha }}
          path: |
            calltype-api.zip
            api-manifest.json
          if-no-files-found: error
          retention-days: 90

  # Distribution builds. Unlike ci.yml's dev-build, these refuse to build
  # without a real, non-local production API URL — an artifact with a
  # localhost/HTTP fallback baked in must never leave this workflow.
  build-clients:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            command: flutter build web --release
            artifact: build/web
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - platform: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/calltype-macos.tar.gz
          - platform: ios-unsigned
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/calltype-ios-unsigned.tar.gz
    defaults:
      run:
        working-directory: src/client/calltype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Refuse an unusable production API URL
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ vars.CALLTYPE_API_BASE_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::CALLTYPE_API_BASE_URL repository variable is empty. Set it to the deployed API's HTTPS URL before releasing."
            exit 1
          fi
          case "$URL" in
            http://*) echo "::error::CALLTYPE_API_BASE_URL must be HTTPS, got: $URL"; exit 1 ;;
          esac
          case "$URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*::1*)
              echo "::error::CALLTYPE_API_BASE_URL points at a loopback address, not a public endpoint: $URL"
              exit 1 ;;
          esac
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.x'
          cache: true
      # The app's drift schema lives in the pure-Dart core package and its
      # *.g.dart is not committed, so it must be generated before the app
      # can be analyzed or built.
      - name: calltype_core codegen
        working-directory: src/client/calltype_core
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release artifact
        run: ${{ matrix.command }} --dart-define=API_BASE_URL=${{ vars.CALLTYPE_API_BASE_URL }}
      - name: Archive macOS bundle preserving executable permissions
        if: matrix.platform == 'macos'
        run: tar -czf build/calltype-macos.tar.gz -C build/macos/Build/Products/Release .
      - name: Archive unsigned iOS bundle (no Apple signing identity configured — clearly unsigned)
        if: matrix.platform == 'ios-unsigned'
        run: tar -czf build/calltype-ios-unsigned.tar.gz -C build/ios/iphoneos .
      - name: Zip whole Windows runtime directory
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../calltype-windows.zip .
      - name: Write build manifest (commit, tool versions, API URL, artifact hash)
        shell: bash
        run: |
          set -euo pipefail
          # `--machine` prints pretty JSON ("frameworkVersion": "x.y.z"), so parse
          # with sed rather than assuming compact output.
          FLUTTER_VER=$(flutter --version --machine | sed -nE 's/.*"frameworkVersion": *"([^"]+)".*/\1/p')
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ARTIFACT_PATH="calltype-windows.zip"
          else
            ARTIFACT_PATH="${{ matrix.artifact }}"
          fi
          if [ -d "$ARTIFACT_PATH" ]; then
            SHA256=$(find "$ARTIFACT_PATH" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          else
            SHA256=$(sha256sum "$ARTIFACT_PATH" | cut -d' ' -f1)
          fi
          cat > build-manifest.json <<EOF
          {
            "commitSha": "${{ inputs.commit_sha }}",
            "platform": "${{ matrix.platform }}",
            "flutterVersion": "$FLUTTER_VER",
            "apiBaseUrl": "${{ vars.CALLTYPE_API_BASE_URL }}",
            "artifactSha256": "$SHA256",
            "unsigned": ${{ matrix.platform == 'ios-unsigned' && 'true' || 'false' }}
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: calltype-release-${{ matrix.platform }}-${{ inputs.commit_sha }}
          path: |
            src/client/calltype/${{ matrix.platform == 'windows' && 'calltype-windows.zip' || matrix.artifact }}
            src/client/calltype/build-manifest.json
          if-no-files-found: error
          retention-days: 90

  deploy-api:
    needs: build-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: calltype-beta
    permissions:
      id-token: write # required for OIDC azure/login
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calltype-release-api-${{ inputs.commit_sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Fail if the target App Service does not exist (never create replacement infra here)
        run: |
          az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query id -o tsv
      # EF Core migrations run inside the app on startup
      # (Database__ApplyMigrationsOnStartup=true). Safe because the beta runs
      # exactly one B1 instance, so there is never a concurrent migrator; the
      # runner therefore needs no database access or connection-string secret.
      - name: Deploy API package (B1 has no slots — expect a brief outage while the app restarts)
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path calltype-api.zip \
            --type zip

  deploy-web:
    needs: build-clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: calltype-beta
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calltype-release-web-${{ inputs.commit_sha }}
          path: web-artifact
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1.0.0
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: web-artifact/build/web
          skip_app_build: true

  smoke-test:
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API liveness (/health)
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.CALLTYPE_API_BASE_URL }}/health"
      - name: API readiness (/health/ready) — Postgres + Blob reachable
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.CALLTYPE_API_BASE_URL }}/health/ready"
      - name: Web loads
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.CALLTYPE_SWA_URL }}"
      # ponytail: authenticated SignalR negotiate smoke test is a TODO — it needs
      # a real registered device + JWT to negotiate a hub connection, which this
      # workflow does not provision. Until that fixture exists, this step is a
      # documented gap, not a fabricated pass. See docs/acceptance/release-builds.md.
      - name: SignalR smoke test (NOT_RUN — see docs/acceptance/release-builds.md)
        run: echo "SignalR authenticated smoke test not implemented in this workflow; run Q01's manual check before wider distribution."
