# Stub for P6 (stream P). It exists so release-native.yml is a valid
# dispatcher from the first commit; P6 replaces the job with the real
# macos build. Fails loudly instead of pretending to have built anything.

name: Release macos (reusable)

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::macos release is not implemented yet (P6)."
          exit 1
